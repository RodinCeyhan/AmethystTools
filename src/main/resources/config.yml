# Supported Mini Message, RGB and legacy color codes

messages:
  only-players: "<red>Only players can use this command."
  wrong-material: "<red>Please enter a valid material."
  wrong-tool: "<red>Please enter a valid tool."
  empyt-arg2: "<red>Please enter a tool type (pickaxe, axe, shovel)."
  invfull: "<dark_purple>{material} {tool} <red>could not be added to your inventory because it is full."
  invfull-actionbar: "<red>Your inventory is full!"
  reloadplugin: "&aPlugin reload is succesfuly complete."
  reloadplugin-actionbar: "&aReloaded Plugin"
  nopermission: "<red>You don't have permission!"
  nopermission-actionbar: "<red>You don't have permission!"
  use-give: "<red>Use: &7/amethysttoolsgive <player> <tier> <type>"
  player-notfound: "<red>{player} not found."
  player-notfound-actionbar: "<red>Player not found"
  enter-tier: "<red>Please enter a tool tier."

# AmethystTools block-breaking mode
# OLD: Original 3x3 behavior from the GitHub version
# NEW: 3x3 pickaxe/shovel, tree-capitator axe, effects and plant exclusions
