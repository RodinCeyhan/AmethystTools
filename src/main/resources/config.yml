# Supported Mini Message, RGB and legacy color codes

messages:
  only-players: "<red>Only players can use this command."
  invfull: "{material} {tool} <red>could not be added to your inventory because it is full."
  invfull-actionbar: "<red>Your inventory is full!"
  reloadplugin: "&aPlugin reload is successfully complete."
  reloadplugin-actionbar: "&aReloaded Plugin"

# Effects played when Amethyst tools break blocks
break-particles: true
break-sound: true

# Allow new enchantments on Amethyst tools (enchanting table and anvil).
# If false, enchantments the tools already have are kept.
enable-item-enchant: true

# AmethystTools block-breaking mode
# OLD: Original 3x3 behavior from the GitHub version
# NEW: 3x3 pickaxe/shovel, tree-capitator axe, effects and plant exclusions
block-breaking-mode: NEW

blacklist-blocks:
  - CHEST
  - TRAPPED_CHEST
  - SHULKER_BOX
  - BLACK_SHULKER_BOX
  - BLUE_SHULKER_BOX
  - BROWN_SHULKER_BOX
  - CYAN_SHULKER_BOX
  - GRAY_SHULKER_BOX
  - GREEN_SHULKER_BOX
  - LIGHT_BLUE_SHULKER_BOX
  - LIGHT_GRAY_SHULKER_BOX
  - LIME_SHULKER_BOX
  - MAGENTA_SHULKER_BOX
  - ORANGE_SHULKER_BOX
  - PINK_SHULKER_BOX
  - PURPLE_SHULKER_BOX
  - RED_SHULKER_BOX
  - WHITE_SHULKER_BOX
  - YELLOW_SHULKER_BOX
  - BEDROCK
  - OBSIDIAN
  - CRYING_OBSIDIAN
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COPPER_CHEST
  - EXPOSED_COPPER_CHEST
  - WEATHERED_COPPER_CHEST
